# shad.example.toml
# Copy to ~/.config/shad/shad.toml and adjust paths.

[defaults]
# Which side opencode occupies. The git+bash bundle takes the opposite side.
# Allowed values: top | bottom | left
oc_position   = "top"

# How much of the window the git+bash bundle takes (%).
# The opencode panel gets the remaining space.
panel_percent = 35

# How much of the bundle the git panel takes (%). Bash gets the rest.
# When bundle is horizontal (oc top/bottom): the git panel is on the right.
# When bundle is vertical   (oc left/right): the git panel is on the bottom.
split_percent = 35

# ── Top-level projects ────────────────────────────────────────────────────
# Access: shad projects kb

[projects.kb]
path    = "/home/backsippan/gh/kb"
# session = "kb"  ← omit to use the project key as the session name

[projects.orfe]
path    = "/home/backsippan/gh/tin/orfe"

# ── Grouped projects ──────────────────────────────────────────────────────
# Access: shad projects alvr db
#         shad projects alvr kb
#         shad projects al d    (prefix matching works per level)

[projects.alvr.db]
path    = "/home/backsippan/gh/alvr/db"
# session = "alvr-db"  ← omit to default to "<group>-<key>"

[projects.alvr.kb]
path    = "/home/backsippan/gh/alvr/kb"

[projects.alvr.migrators]
path    = "/home/backsippan/gh/alvr/migrators"

[projects.alvr.portal]
path    = "/home/backsippan/gh/alvr/portal"

[projects.alvr.swisher]
path    = "/home/backsippan/gh/alvr/swisher"
