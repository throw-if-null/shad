name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install tmux
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install dependencies
        shell: bash
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        shell: bash
        run: ruff check src/

      - name: Type check (mypy)
        shell: bash
        run: mypy src/

      - name: Test (pytest)
        shell: bash
        run: pytest

  coral-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify the Coral contract
        shell: bash
        run: make coral-contract

  release:
    needs: [test, coral-contract]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The main-ancestry check needs origin/main and the history.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Check the tag against shad.__version__
        shell: bash
        run: |
          version=$(PYTHONPATH=src python -c 'import shad; print(shad.__version__)')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match shad.__version__ ($version)"
            exit 1
          fi

      - name: Check that the tagged commit is on main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi

      - name: Build the wheel
        shell: bash
        run: pip wheel --no-deps --wheel-dir dist .

      - name: Create the GitHub release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl --verify-tag --generate-notes --title "shad ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  auto-merge:
    needs: test
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      - name: Merge patch and minor updates
        if: contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.metadata.outputs.update-type)
        shell: bash
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
