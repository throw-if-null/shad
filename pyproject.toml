[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "shad"
dynamic = ["version"]
description = "Attach or create project-specific tmux sessions from the current terminal"
requires-python = ">=3.11"
dependencies = ["rich>=15.0.0", "textual>=8.2.8"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.5", "mypy==2.4.1"]

[project.scripts]
shad = "shad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "shad.__version__" }

[tool.pytest.ini_options]
testpaths = ["src/shad"]
